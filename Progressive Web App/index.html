<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Motvin PWA Shell</title>
  <meta name="theme-color" content="#5c4ae4" />
  <link rel="manifest" href="./manifest.json" />
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(circle at 20% 20%, #2b2d7c 0%, #111222 48%, #090a12 100%);
      color: #f3f3ff;
      text-align: center;
      padding: 24px;
    }
    .card {
      width: min(560px, 100%);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 18px;
      background: rgba(12, 13, 24, 0.72);
      backdrop-filter: blur(10px);
      padding: 28px;
    }
    .logo { width: 68px; height: 68px; }
    h1 { margin: 14px 0 10px; font-size: 28px; }
    p { margin: 0 0 20px; opacity: 0.9; }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 18px;
      border-radius: 999px;
      text-decoration: none;
      color: #0b0c1b;
      font-weight: 600;
      background: #d7d9ff;
    }
  </style>
  <link rel="icon" type="image/svg+xml" href="../ASSET/Images/motvin%20logo%20(full%20color).svg" />
</head>
<body>
  <main class="card">
    <img class="logo" src="./branding/logo-install.svg" alt="Motvin logo" />
    <h1>Motvin Progressive Web App</h1>
    <p>This shell is installable and ready for offline caching.</p>
    <a href="../files.html">Open Design Marketplace</a>
  </main>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {
          // No-op fallback for unsupported hosts.
        });
      });
    }
  </script>
</body>
</html>
