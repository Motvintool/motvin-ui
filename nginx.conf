server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/xml+rss application/json
               image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # CORS headers (if needed for API calls from different domain)
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range" always;

    # Health check endpoint (must be before other rules)
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Redirects (matching vercel.json)
    location = /motvin {
        return 301 /motvin/;
    }

    # Rewrites for clean URLs (matching vercel.json)
    # Icons routes
    location ~ ^/(icon|icons|iconstore|iconstores)$ {
        rewrite ^ /icons.html last;
    }

    # Updates/Release notes routes
    location ~ ^/(update|releasenotes|releasenote)$ {
        rewrite ^ /updates/index.html last;
    }

    # MOTVIN directory rewrite
    location ~ ^/motvin/(.*)$ {
        rewrite ^/motvin/(.*)$ /MOTVIN/$1 last;
    }

    # Cache static assets (CSS, JS, images, fonts)
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Don't cache HTML files
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
        try_files $uri =404;
    }

    # Root path serves index.html
    location = / {
        try_files /index.html =404;
    }

    # Clean URLs support (try .html extension, then directory, then 404)
    # This matches Vercel's "cleanUrls: true" behavior
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /404.html;
}
