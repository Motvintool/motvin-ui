  <script>(function () { try { var rawSlugs = localStorage.getItem('openedProductSlugs'); var s = rawSlugs ? JSON.parse(rawSlugs) : []; var p = document.querySelector('.top-pane'); if (!s.length && window.innerWidth > 670) { if (p) p.classList.add('top-pane--hidden'); document.body.classList.add('top-pane-hidden'); return; } var container = document.getElementById('shell-top-pane-product-tabs') || document.getElementById('detail-top-pane-product-tabs'); if (!container || !s.length) return; var prodMap = {}; try { var cachedProdsRaw = localStorage.getItem('motvin_products_v1'); if (cachedProdsRaw) { var cachedProds = JSON.parse(cachedProdsRaw); if (Array.isArray(cachedProds)) { for (var k = 0; k < cachedProds.length; k++) { var item = cachedProds[k]; if (item && item.slug) prodMap[item.slug] = item; } } } } catch (e) { } var params = new URLSearchParams(window.location.search); var reqProduct = params.get('product'); var reqCategory = params.get('category'); var path = window.location.pathname.toLowerCase(); var activeSlug = null; if (reqProduct) { activeSlug = reqProduct; } else if (path.indexOf('filter-template.html') !== -1 || path.indexOf('mobile-template.html') !== -1 || path.indexOf('web-template.html') !== -1) { var cat = reqCategory || (path.indexOf('mobile-template') !== -1 ? 'mobile' : (path.indexOf('web-template') !== -1 ? 'web' : 'free-paid')); activeSlug = 'filter:' + cat; } var isHome = !activeSlug && (path.endsWith('files.html') || path.endsWith('/') || path.endsWith('about-me.html') || path.endsWith('my-post.html') || path.endsWith('recents.html') || path.endsWith('saved-templates.html')); var homeTab = document.querySelector('.top-pane-home-tab'); if (homeTab) { if (isHome) { homeTab.classList.add('is-active'); } else { homeTab.classList.remove('is-active'); } } function titleCase(str) { return String(str || '').replace(/^filter:/, '').replace(/[-_]+/g, ' ').replace(/\b\w/g, function (c) { return c.toUpperCase(); }); } var filterLabels = { 'mobile': 'Mobile Templates', 'web': 'Web Templates', 'free': 'Free Templates', 'paid': 'Paid Templates', 'free-paid': 'Free & Paid Templates', 'recent': 'Recent Templates' }; var iconSvg = '<svg class="tab-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4.00004 5.33329H4.00671M6.66671 5.33329H6.67337M9.33337 5.33329H9.34004M2.66671 2.66663H13.3334C14.0698 2.66663 14.6667 3.26358 14.6667 3.99996V12C14.6667 12.7363 14.0698 13.3333 13.3334 13.3333H2.66671C1.93033 13.3333 1.33337 12.7363 1.33337 12V3.99996C1.33337 3.26358 1.93033 2.66663 2.66671 2.66663Z" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>'; var html = ''; for (var i = 0; i < s.length; i++) { var slug = s[i]; var isActive = !isHome && (slug === activeSlug); var title = ''; if (slug.indexOf('filter:') === 0) { title = filterLabels[slug.replace('filter:', '')] || 'Free & Paid Templates'; } else if (prodMap[slug] && prodMap[slug].title) { title = prodMap[slug].title; } else { title = titleCase(slug); } html += '<div class="top-pane-tab' + (isActive ? ' is-active' : '') + '" data-product-slug="' + slug + '">' + iconSvg + '<span>' + title + '</span><button class="tab-close" type="button" aria-label="Close tab"><svg viewBox="0 0 10 10" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M1 1L9 9M9 1L1 9" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" /></svg></button></div>'; } container.innerHTML = html; } catch (e) { } })();</script>
