<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Button Component Variants</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../../CSS/global.css" />
<link rel="stylesheet" href="Button.css" />
<style>
  body {
    margin: 0;
    padding: 20px;
    background: #1f2124;
    color: #ffffff;
    font-family: 'Inter', sans-serif;
  }

  .button-showcase {
    border: 1px dashed #8f63ff;
    border-radius: 8px;
    padding: 20px;
    display: grid;
    gap: 24px;
  }

  .button-showcase-group {
    display: grid;
    gap: 14px;
  }

  .button-showcase-group h3 {
    margin: 0;
    font-size: 13px;
    font-weight: 600;
    color: #d8d8d8;
  }

  .button-showcase-row {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
  }
</style>

  <link rel="icon" type="image/svg+xml" href="../../ASSET/Images/motvin%20logo%20(full%20color).svg" />
</head>
<body>
  <main>
    <div class="button-showcase" data-button-showcase></div>
  </main>

  <script src="Button.js"></script>
</body>
</html>
